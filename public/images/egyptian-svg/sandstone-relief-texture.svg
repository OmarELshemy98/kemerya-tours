<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  fill="none"
  stroke="currentColor"
  stroke-width="0.5"
  stroke-linejoin="miter"
  preserveAspectRatio="xMidYMid meet"
  aria-hidden="true"
>
  <!-- Subtle sandstone relief texture: sparse diagonal and orthogonal lines
       inspired by carved stone masonry joints. Must remain barely visible. -->
  <defs>
    <pattern id="sandstone-relief" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <!-- Diagonal grain (stone tool marks) -->
      <path d="M0 10 L20 10 M10 0 L10 20 M15 5 L25 15" stroke-width="0.3" opacity="0.06" />
      <!-- Subtle stepped motif (pylon-inspired) -->
      <path d="M2 16 L4 14 L6 16" stroke-width="0.3" opacity="0.04" fill="none" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#sandstone-relief)" />
</svg>