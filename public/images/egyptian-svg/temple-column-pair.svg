<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 140 240"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <!-- Left column -->
  <line x1="20" y1="20" x2="20" y2="200" />
  <line x1="50" y1="20" x2="50" y2="200" />
  <!-- Left capital: lotus -->
  <path d="M20 20 Q32 8, 42 20" />
  <path d="M22 20 C26 14, 30 12, 35 14 C40 16, 40 22, 36 26 C32 30, 28 30, 24 28" />
  <!-- Left capital top (abacus) -->
  <line x1="20" y1="16" x2="50" y2="16" stroke-width="1" />
  <!-- Left base -->
  <rect x="18" y="200" width="34" height="12" />

  <!-- Right column -->
  <line x1="90" y1="20" x2="90" y2="200" />
  <line x1="120" y1="20" x2="120" y2="200" />
  <!-- Right capital: papyrus -->
  <path d="M90 20 Q102 8, 112 20" />
  <path d="M92 20 C96 14, 100 12, 105 14 C110 16, 110 22, 106 26 C102 30, 98 30, 94 28" />
  <!-- Right capital top (abacus) -->
  <line x1="90" y1="16" x2="120" y2="16" stroke-width="1" />
  <!-- Right base -->
  <rect x="88" y="200" width="34" height="12" />

  <!-- Fluting lines on left shaft -->
  <line x1="28" y1="20" x2="28" y2="200" stroke-width="0.3" />
  <line x1="34" y1="20" x2="34" y2="200" stroke-width="0.3" />
  <line x1="38" y1="20" x2="38" y2="200" stroke-width="0.3" />
  <!-- Fluting lines on right shaft -->
  <line x1="98" y1="20" x2="98" y2="200" stroke-width="0.3" />
  <line x1="104" y1="20" x2="104" y2="200" stroke-width="0.3" />
  <line x1="110" y1="20" x2="110" y2="200" stroke-width="0.3" />

  <!-- Entablature beam connecting columns -->
  <line x1="50" y1="20" x2="90" x2="90" y2="20" stroke-width="1" />
</svg>