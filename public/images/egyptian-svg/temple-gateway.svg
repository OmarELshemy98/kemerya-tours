<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 320 300"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="square"
  stroke-linejoin="miter"
  aria-hidden="true"
>
  <!-- Massive pylon walls (battered, sloping inward) -->
  <polygon
    points="0,280 320,280 260,40 60,40"
    fill="none"
  />
  <!-- Inner gateway opening -->
  <polygon
    points="50,270 270,270 230,60 90,60"
    fill="none"
  />
  <!-- Cornice stepping (Egyptian-style recessed course) -->
  <path d="M60 40 L60 20 L260 20 L260 40" stroke-width="1.5" />
  <!-- Central threshold base -->
  <rect x="130" y="260" width="60" height="10" stroke-width="1" />
</svg>