<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 80 16"
  fill="none"
  stroke="currentColor"
  stroke-width="1"
  stroke-linecap="round"
  stroke-linejoin="round"
  preserveAspectRatio="none"
  aria-hidden="true"
>
  <!-- Seamless geometric border based on Egyptian meander pattern -->
  <!-- Tile width = 20 units -->
  <defs>
    <pattern id="egyptian-border-pattern" x="0" y="0" width="20" height="16" patternUnits="userSpaceOnUse">
      <!-- Stepped meander wave -->
      <path d="M0 8 L5 8 L5 3 L10 3 L10 8 L15 8 L15 3 L20 3" fill="none" />
      <!-- Interlocking squares at corners -->
      <rect x="2" y="6" width="3" height="3" fill="currentColor" />
      <rect x="15" y="6" width="3" height="3" fill="currentColor" />
    </pattern>
  </defs>
  <!-- Background uses the seamless pattern -->
  <rect x="0" y="0" width="80" height="16" fill="url(#egyptian-border-pattern)" />
  <!-- Top and bottom rails -->
  <line x1="0" y1="0" x2="80" y2="0" stroke-width="1" />
  <line x1="0" y1="16" x2="80" y2="16" stroke-width="1" />
</svg>