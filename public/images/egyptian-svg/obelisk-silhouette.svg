<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 140"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  stroke-linecap="square"
  stroke-linejoin="miter"
  aria-hidden="true"
>
  <!-- Pyramidion (pointed top) -->
  <polygon points="12,4 6,16 18,16" fill="none" />
  <!-- Shaft -->
  <rect x="8" y="16" width="8" height="100" />
  <!-- Inscription band -->
  <line x1="8" y1="40" x2="16" y2="40" stroke-width="0.5" />
  <line x1="8" y1="52" x2="16" y2="52" stroke-width="0.5" />
  <line x1="8" y1="64" x2="16" y2="64" stroke-width="0.5" />
  <!-- Base platform -->
  <rect x="4" y="116" width="16" height="20" />
  <line x1="4" y1="116" x2="20" y2="116" stroke-width="0.5" />
</svg>